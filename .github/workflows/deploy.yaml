name: Blue Green Deploy

on:
  push:
    branches: [ "main" ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ secrets.AWS_REGION }}

    - name: Login to ECR
      run: |
        aws ecr get-login-password --region ${{ secrets.AWS_REGION }} | \
        docker login --username AWS --password-stdin 021859068728.dkr.ecr.eu-north-1.amazonaws.com

    - name: Build image
      run: |
        docker build -t coffee001:${{ github.sha }} .

    - name: Tag and push
      run: |
        docker tag coffee001:${{ github.sha }} ${{ secrets.ECR_REPO_URI }}:${{ github.sha }}
        docker push ${{ secrets.ECR_REPO_URI }}:${{ github.sha }}

    - name: Deploy to GREEN
      run: |
        echo "${{ secrets.EC2_SSH_KEY }}" > key.pem
        chmod 600 key.pem

        ssh -o StrictHostKeyChecking=no -i key.pem ec2-user@${{ secrets.GREEN_EC2_IP }} << EOF
          aws ecr get-login-password --region eu-north-1 | \
          docker login --username AWS --password-stdin 021859068728.dkr.ecr.eu-north-1.amazonaws.com

          docker pull ${{ secrets.ECR_REPO_URI }}:${{ github.sha }}
          docker stop app || true
          docker rm app || true
          docker run -d -p 3000:3000 --name app \
            -e APP_VERSION=${{ github.sha }} \
            ${{ secrets.ECR_REPO_URI }}:${{ github.sha }}
        EOF
