name: Blue-Green Deployment

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        run: |
          aws ecr get-login-password --region eu-north-1 | \
          docker login --username AWS --password-stdin 021859068728.dkr.ecr.eu-north-1.amazonaws.com


      - name: Build Docker image
        run: docker build -t coffee001:latest .

      - name: Tag & push image to ECR
        run: |
          docker tag coffee001:latest 021859068728.dkr.ecr.eu-north-1.amazonaws.com/coffee001:latest
          docker push 021859068728.dkr.ecr.eu-north-1.amazonaws.com/coffee001:latest

      - name: Deploy to GREEN EC2
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.GREEN_EC2_IP }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            aws ecr get-login-password --region ${{ secrets.AWS_REGION }} | \
            docker login --username AWS --password-stdin ${{ secrets.ECR_REPO }}

            docker pull ${{ secrets.ECR_REPO }}:latest
            docker stop app || true
            docker rm app || true
            docker run -d -p 3000:3000 --name app \
              -e APP_VERSION=latest \
              ${{ secrets.ECR_REPO }}:latest

      - name: Health check on GREEN
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.GREEN_EC2_IP }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            echo "Waiting for app..."
            sleep 10
            curl -f http://localhost:3000/health
